<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>像素画制作器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{overflow:hidden;height:100vh}
/* 灰白棋盘透明背景 */
body{
  background-image: linear-gradient(45deg,#bbbbbb 25%,transparent 25%,transparent 75%,#bbbbbb 75%),linear-gradient(45deg,#bbbbbb 25%,#eeeeee 25%,#eeeeee 75%,#bbbbbb 75%);
  background-size:20px 20px;
  background-position:0 0,10px 10px;
}
#viewport{position:fixed;top:0;left:0;width:100vw;height:100vh;overflow:hidden;cursor:grab}
#viewport:active{cursor:grabbing}
/* 右上角操作台按钮 */
#panelToggle{position:fixed;top:12px;right:12px;z-index:200;padding:8px 14px;background:#4488ff;border:none;color:white;border-radius:6px;cursor:pointer;font-size:14px}
#panel{position:fixed;top:48px;right:12px;width:340px;background:#333;border-radius:8px;padding:14px;z-index:190;display:none;max-height:calc(100vh - 60px);overflow-y:auto}
#panel.open{display:block}
.panel-section{margin-bottom:16px;border-bottom:1px solid #555;padding-bottom:12px}
h4{margin-bottom:8px}
.color-top-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
#colorPicker{width:50px;height:36px;border:none}
.rgb-inputs{display:flex;gap:4px}
.rgb-inputs input{width:52px;padding:4px}
#hexInput{width:90px;padding:4px}
.color-buttons{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
button{padding:5px 9px;border:none;border-radius:4px;cursor:pointer}
button:disabled{opacity:0.4;cursor:not-allowed}
/* 当前激活工具按钮高亮 */
.toolbar button.active-tool{
  background-color:#2b78e4;
  color:#fff;
}
.colorGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.colorCell{width:32px;height:32px;border:1px solid #888;border-radius:3px}
.colorCell.empty{background:#1a1a1a}
.colorCell.delMode{border-color:#ff4444;border-width:2px}
.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
#textInputWrap{display:none;margin:8px 0}
#textInput{width:100%;padding:5px}
.exportMode{display:flex;gap:8px;margin-top:8px}
</style>
</head>
<body>
<div id="viewport">
  <canvas id="mainCanvas"></canvas>
</div>
<button id="panelToggle">展开操作台</button>
<div id="panel">
  <div class="panel-section">
    <h4>颜色选择</h4>
    <div class="color-top-row">
      <input type="color" id="colorPicker">
      <div class="rgb-inputs">
        <input id="r" placeholder="R" type="number" min="0" max="255">
        <input id="g" placeholder="G" type="number" min="0" max="255">
        <input id="b" placeholder="B" type="number" min="0" max="255">
      </div>
      <input id="hexInput" placeholder="#RRGGBB">
    </div>
    <div class="color-buttons">
      <button id="saveColorBtn">保存颜色</button>
      <button id="delColorBtn">删除颜色</button>
      <button id="eyedropperBtn">吸色器</button>
    </div>
    <div>预设32色：</div>
    <div class="colorGrid" id="presetColors"></div>
    <div style="margin-top:6px">自定义32色：</div>
    <div class="colorGrid" id="customColors"></div>
  </div>
  <div class="panel-section">
    <h4>画笔工具</h4>
    <div class="toolbar">
      <button data-tool="select">选择(拖动)</button>
      <button data-tool="pencil">铅笔(1格)</button>
      <button data-tool="brush">粗画笔(2×2)</button>
      <button data-tool="line">直线</button>
      <button data-tool="eraser">橡皮擦</button>
      <button data-tool="text">文字</button>
    </div>
    <div id="textInputWrap">
      <input id="textInput" placeholder="输入文字，点击方格放置">
    </div>
  </div>
  <div class="panel-section">
    <h4>画布操作</h4>
    <div class="toolbar">
      <button id="undoBtn">撤销</button>
      <button id="redoBtn">重做</button>
      <button id="clearBtn">清空画布</button>
    </div>
    <div class="exportMode">
      <button id="exportFull">导出全图PNG</button>
      <button id="exportSelect">框选导出PNG</button>
    </div>
    <input type="file" id="imgUpload" accept="image/*" style="margin-top:8px">
  </div>
</div>
<script>
const state = {
  offsetX: 0,
  offsetY: 0,
  scale: 1,
  cellSize: 20, //每个方格像素大小
  gridW: 100,   //横向方格总数
  gridH: 100,   //纵向方格总数
  isDragViewport: false,
  dragStart: {x:0,y:0},
  currentTool: "select", //默认选择工具
  selectedColor: "#000000",
  customPalette: Array(32).fill(null),
  delMode: false,
  isEyedropper: false,
  drawing: false,
  startCell: null,
  // 核心：存储每一格颜色，null=空白透明
  cellData: [],
  history:[],
  historyIndex:-1,
  //框选导出状态
  exportSelectMode:false,
  selectStart:null
};
// 初始化方格数据
function initCellData(){
  state.cellData = [];
  for(let y=0;y<state.gridH;y++){
    state.cellData[y] = [];
    for(let x=0;x<state.gridW;x++){
      state.cellData[y][x] = null;
    }
  }
}
initCellData();

const canvas = document.getElementById("mainCanvas");
const ctx = canvas.getContext("2d");
const viewport = document.getElementById("viewport");

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

// ===== 坐标转换：屏幕鼠标坐标 → 方格坐标gx gy =====
function screenToGrid(e){
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  //逆变换
  const worldX = (mouseX - state.offsetX)/state.scale;
  const worldY = (mouseY - state.offsetY)/state.scale;
  const gx = Math.floor(worldX / state.cellSize);
  const gy = Math.floor(worldY / state.cellSize);
  return {gx,gy, worldX, worldY, mouseX, mouseY};
}

//根据屏幕鼠标坐标直接计算方格位置
function screenToGridFromMouse(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const mouseX = clientX - rect.left;
  const mouseY = clientY - rect.top;
  const worldX = (mouseX - state.offsetX) / state.scale;
  const worldY = (mouseY - state.offsetY) / state.scale;
  const gx = Math.floor(worldX / state.cellSize);
  const gy = Math.floor(worldY / state.cellSize);
  return { gx, gy };
}

// 判断方格是否在合法范围内
function isValidCell(gx,gy){
  return gx>=0 && gy>=0 && gx<state.gridW && gy<state.gridH;
}

// 填充单个方格
function setCell(gx,gy,color){
  if(!isValidCell(gx,gy)) return;
  state.cellData[gy][gx] = color;
}
//2×2方块填充
function set2x2(gx,gy,color){
  setCell(gx,gy,color);
  setCell(gx+1,gy,color);
  setCell(gx,gy+1,color);
  setCell(gx+1,gy+1,color);
}

//Bresenham直线填充方格
function lineCells(x0,y0,x1,y1,color){
  let dx = Math.abs(x1-x0);
  let dy = Math.abs(y1-y0);
  let sx = x0 < x1 ? 1 : -1;
  let sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  while(true){
    setCell(x0,y0,color);
    if(x0 === x1 && y0 === y1) break;
    let e2 = 2*err;
    if(e2 > -dy){ err -= dy; x0 += sx;}
    if(e2 < dx){ err += dx; y0 += sy;}
  }
}

// ===== 撤销重做 =====
function saveHistory(){
  state.history.splice(state.historyIndex+1);
  const copy = JSON.parse(JSON.stringify(state.cellData));
  state.history.push(copy);
  state.historyIndex = state.history.length -1;
  updateHistoryBtn();
}
function undo(){
  if(state.historyIndex <=0) return;
  state.historyIndex--;
  state.cellData = JSON.parse(JSON.stringify(state.history[state.historyIndex]));
  renderGridCells();
  updateHistoryBtn();
}
function redo(){
  if(state.historyIndex >= state.history.length-1) return;
  state.historyIndex++;
  state.cellData = JSON.parse(JSON.stringify(state.history[state.historyIndex]));
  renderGridCells();
  updateHistoryBtn();
}
function updateHistoryBtn(){
  document.getElementById("undoBtn").disabled = state.historyIndex <=0;
  document.getElementById("redoBtn").disabled = state.historyIndex >= state.history.length-1;
}
saveHistory();

//更新工具按钮高亮
function updateToolButtonsHighlight(){
  document.querySelectorAll(".toolbar [data-tool]").forEach(btn=>{
    if(btn.dataset.tool === state.currentTool){
      btn.classList.add("active-tool");
    }else{
      btn.classList.remove("active-tool");
    }
  })
}

// ===== 绘制全部方格：一格一格画边框+填充色，网格不是背景！=====
function renderGridCells(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(state.offsetX, state.offsetY);
  ctx.scale(state.scale, state.scale);
  //遍历所有方格，绘制方格
  for(let gy=0;gy<state.gridH;gy++){
    for(let gx=0;gx<state.gridW;gx++){
      const px = gx * state.cellSize;
      const py = gy * state.cellSize;
      const color = state.cellData[gy][gx];
      if(color){
        ctx.fillStyle = color;
        ctx.fillRect(px,py,state.cellSize,state.cellSize);
      }
      //方格边框
      ctx.strokeStyle="#444";
      ctx.lineWidth=1;
      ctx.strokeRect(px,py,state.cellSize,state.cellSize);
    }
  }
  ctx.restore();

  //绘制框选虚线框
  if(state.exportSelectMode && state.selectStart){
    ctx.save();
    ctx.setLineDash([4,4]);
    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=2;
    const s = state.selectStart;
    ctx.strokeRect(s.sx,s.sy,s.ex-s.sx,s.ey-s.sy);
    ctx.restore();
  }
}
renderGridCells();

// ===== 视口拖拽平移 =====
viewport.addEventListener("mousedown",e=>{
  if(e.target !== canvas) return;
  const gridPos = screenToGrid(e);

  //框选导出模式优先
  if(state.exportSelectMode){
    state.selectStart = {
      sx:gridPos.mouseX,
      sy:gridPos.mouseY,
      ex:gridPos.mouseX,
      ey:gridPos.mouseY
    };
    return;
  }

  //选择工具：无论点击哪里都拖动视口
  if(state.currentTool === "select"){
    state.isDragViewport = true;
    state.dragStart = {x:e.clientX - state.offsetX, y:e.clientY - state.offsetY};
    return;
  }

  //如果点击不是在画布方格区域，则是拖动视口
  if(!isValidCell(gridPos.gx,gridPos.gy)){
    state.isDragViewport = true;
    state.dragStart = {x:e.clientX - state.offsetX, y:e.clientY - state.offsetY};
    return;
  }

  // 点击方格区域：绘画
  if(state.isEyedropper){
    const {gx,gy} = gridPos;
    const c = state.cellData[gy][gx];
    if(c){
      state.selectedColor = c;
      colorPicker.value = c;
      hexInput.value = c;
      const rgb = hexToRgb(c);
      r.value = rgb.r; g.value = rgb.g; b.value = rgb.b;
    }
    state.isEyedropper = false;
    eyedropperBtn.textContent="吸色器";
    canvas.style.cursor="";
    return;
  }
  state.drawing = true;
  state.startCell = gridPos;
  if(state.currentTool === "text"){
    const txt = document.getElementById("textInput").value;
    if(txt){
      //直接绘制字形，不再覆盖单个像素格
      ctx.save();
      ctx.translate(state.offsetX, state.offsetY);
      ctx.scale(state.scale, state.scale);
      const px = gridPos.gx * state.cellSize;
      const py = gridPos.gy * state.cellSize;
      ctx.fillStyle = state.selectedColor;
      ctx.font = `${state.cellSize}px monospace`;
      ctx.fillText(txt, px, py + state.cellSize*0.85);
      ctx.restore();
      saveHistory();
      renderGridCells();
    }
    state.drawing=false;
    return;
  }
  if(state.currentTool === "line"){
    saveHistory();
    return;
  }
  drawAtCell(gridPos.gx, gridPos.gy);
  renderGridCells();
})

window.addEventListener("mousemove",e=>{
  //框选模式
  if(state.exportSelectMode && state.selectStart){
    const gp = screenToGrid(e);
    state.selectStart.ex = gp.mouseX;
    state.selectStart.ey = gp.mouseY;
    renderGridCells();
    return;
  }

  if(state.isDragViewport){
    state.offsetX = e.clientX - state.dragStart.x;
    state.offsetY = e.clientY - state.dragStart.y;
    renderGridCells();
    return;
  }
  if(!state.drawing) return;
  const {gx,gy} = screenToGrid(e);
  if(state.currentTool === "line"){
    //读取历史，重绘
    state.cellData = JSON.parse(JSON.stringify(state.history[state.historyIndex]));
    lineCells(state.startCell.gx, state.startCell.gy, gx,gy, state.selectedColor);
    renderGridCells();
    return;
  }
  drawAtCell(gx,gy);
  renderGridCells();
})

window.addEventListener("mouseup",()=>{
  //处理框选导出：按方格原始数据导出透明png，不再截屏
  if(state.exportSelectMode && state.selectStart){
    const s = state.selectStart;
    const p1 = screenToGridFromMouse(s.sx, s.sy);
    const p2 = screenToGridFromMouse(s.ex, s.ey);

    let gx1 = Math.min(p1.gx, p2.gx);
    let gy1 = Math.min(p1.gy, p2.gy);
    let gx2 = Math.max(p1.gx, p2.gx);
    let gy2 = Math.max(p1.gy, p2.gy);

    gx1 = Math.max(0, gx1);
    gy1 = Math.max(0, gy1);
    gx2 = Math.min(state.gridW - 1, gx2);
    gy2 = Math.min(state.gridH - 1, gy2);

    const gw = gx2 - gx1 + 1;
    const gh = gy2 - gy1 + 1;

    if (gw > 0 && gh > 0) {
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = gw * state.cellSize;
      exportCanvas.height = gh * state.cellSize;
      const ectx = exportCanvas.getContext("2d");

      for (let gy = gy1; gy <= gy2; gy++) {
        for (let gx = gx1; gx <= gx2; gx++) {
          const color = state.cellData[gy][gx];
          if (color) {
            ectx.fillStyle = color;
            ectx.fillRect(
              (gx - gx1) * state.cellSize,
              (gy - gy1) * state.cellSize,
              state.cellSize,
              state.cellSize
            );
          }
        }
      }
      const a = document.createElement("a");
      a.download = "pixel-selection.png";
      a.href = exportCanvas.toDataURL("image/png");
      a.click();
    }

    state.exportSelectMode = false;
    state.selectStart = null;
    document.getElementById("exportSelect").textContent = "框选导出PNG";
    renderGridCells();
  }

  if(state.isDragViewport){
    state.isDragViewport = false;
    return;
  }
  if(state.drawing){
    saveHistory();
  }
  state.drawing = false;
})

//绘制工具
function drawAtCell(gx,gy){
  if(state.currentTool === "pencil"){
    setCell(gx,gy, state.selectedColor);
  }else if(state.currentTool === "brush"){
    set2x2(gx,gy,state.selectedColor);
  }else if(state.currentTool === "eraser"){
    setCell(gx,gy,null);
  }
}

//滚轮缩放
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const delta = e.deltaY>0 ? -0.1 :0.1;
  state.scale = Math.max(0.2, Math.min(3, state.scale+delta));
  renderGridCells();
},{passive:false})

// ===== 颜色逻辑 =====
const colorPicker = document.getElementById("colorPicker");
const r = document.getElementById("r"),g=document.getElementById("g"),b=document.getElementById("b");
const hexInput = document.getElementById("hexInput");
colorPicker.value="#000000";
colorPicker.oninput=()=>{
  state.selectedColor = colorPicker.value;
  hexInput.value = state.selectedColor;
  const c = hexToRgb(state.selectedColor);
  r.value = c.r;g.value=c.g;b.value=c.b;
}
[r,g,b].forEach(ipt=>ipt.oninput=()=>{
  const rv = Number(r.value)||0;
  const gv = Number(g.value)||0;
  const bv = Number(b.value)||0;
  const h = rgbToHex(rv,gv,bv);
  state.selectedColor = h;
  colorPicker.value = h;
  hexInput.value = h;
})
hexInput.oninput = ()=>{
  let h = hexInput.value.trim();
  if(/^#[0-9a-fA-F]{6}$/.test(h)){
    state.selectedColor = h;
    colorPicker.value = h;
    const c = hexToRgb(h);
    r.value=c.r;g.value=c.g;b.value=c.b;
  }
}
function hexToRgb(hex){
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function rgbToHex(r,g,b){
  r=Math.max(0,Math.min(255,r));
  g=Math.max(0,Math.min(255,g));
  b=Math.max(0,Math.min(255,b));
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

//32预设色
const preset32 = [
"#000000","#434343","#666666","#999999","#b7b7b7","#cccccc","#d9d9d9","#ffffff",
"#980000","#ff0000","#ff9900","#ffff00","#00ff00","#00ffff","#4a86e8","#0000ff",
"#9900ff","#ff00ff","#741b47","#e6b8af","#f4cccc","#fce5cd","#fff2cc","#d9ead3",
"#d0e0e3","#cfe2f3","#d9d2e9","#ead1dc","#c27ba0","#ea9999","#f9cb9c","#ffe599"
];
const presetWrap = document.getElementById("presetColors");
const customWrap = document.getElementById("customColors");
function buildColorGrid(){
  presetWrap.innerHTML = "";
  preset32.forEach(c=>{
    const d = document.createElement("div");
    d.className="colorCell"; d.style.background=c;
    d.onclick=()=>{ state.selectedColor=c; colorPicker.value=c; hexInput.value=c; const h=hexToRgb(c);r.value=h.r;g.value=h.g;b.value=h.b; }
    presetWrap.appendChild(d);
  })
  customWrap.innerHTML = "";
  state.customPalette.forEach((col,idx)=>{
    const d = document.createElement("div");
    d.className="colorCell"+(col? "":" empty");
    if(col) d.style.background = col;
    if(state.delMode && col) d.classList.add("delMode");
    d.onclick = ()=>{
      if(state.delMode){
        if(state.customPalette[idx]) state.customPalette[idx]=null;
        buildColorGrid();
      }else if(col){
        state.selectedColor=col; colorPicker.value=col; hexInput.value=col;
        const h=hexToRgb(col); r.value=h.r;g.value=h.g;b.value=h.b;
      }
    }
    customWrap.appendChild(d);
  })
}
buildColorGrid();

document.getElementById("saveColorBtn").onclick = ()=>{
  const emptyIdx = state.customPalette.findIndex(x=>x===null);
  if(emptyIdx===-1){alert("自定义色块已满32个");return;}
  state.customPalette[emptyIdx]=state.selectedColor;
  buildColorGrid();
}
const delBtn = document.getElementById("delColorBtn");
delBtn.onclick = ()=>{
  state.delMode = !state.delMode;
  delBtn.textContent = state.delMode ? "保存删除" : "删除颜色";
  if(state.delMode){
    alert("进入删除模式：点击已有颜色色块删除，完成后点【保存删除】退出");
  }
  buildColorGrid();
}
const eyedropperBtn = document.getElementById("eyedropperBtn");
eyedropperBtn.onclick = ()=>{
  state.isEyedropper = !state.isEyedropper;
  eyedropperBtn.textContent = state.isEyedropper ? "退出吸色" : "吸色器";
  canvas.style.cursor = state.isEyedropper ? "crosshair":"";
}

//工具切换
document.querySelectorAll("[data-tool]").forEach(btn=>{
  btn.onclick=()=>{
    state.currentTool = btn.dataset.tool;
    state.isEyedropper=false;
    eyedropperBtn.textContent="吸色器";
    canvas.style.cursor="";
    document.getElementById("textInputWrap").style.display = state.currentTool==="text"?"block":"none";
    updateToolButtonsHighlight();
  }
})

document.getElementById("clearBtn").onclick = ()=>{
  initCellData();
  saveHistory();
  renderGridCells();
}
document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;

//导出全画布
document.getElementById("exportFull").onclick = ()=>{
  const exportCanvas = document.createElement("canvas");
  exportCanvas.width = state.gridW * state.cellSize;
  exportCanvas.height = state.gridH * state.cellSize;
  const ectx = exportCanvas.getContext("2d");
  for(let gy=0;gy<state.gridH;gy++){
    for(let gx=0;gx<state.gridW;gx++){
      const c = state.cellData[gy][gx];
      if(c){
        ectx.fillStyle = c;
        ectx.fillRect(gx*state.cellSize,gy*state.cellSize,state.cellSize,state.cellSize);
      }
    }
  }
  const a = document.createElement("a");
  a.download="pixel-full.png";
  a.href = exportCanvas.toDataURL("image/png");
  a.click();
}

//框选导出
const exportSelBtn = document.getElementById("exportSelect");
exportSelBtn.onclick = ()=>{
  state.exportSelectMode = true;
  exportSelBtn.textContent="拖动屏幕框选";
}

//图片上传，自定义方格宽高
document.getElementById("imgUpload").onchange = e=>{
  const file = e.target.files[0];
  if(!file) return;
  const wStr = prompt("图片占多少方格宽度：");
  const hStr = prompt("图片占多少方格高度：");
  const gw = parseInt(wStr);
  const gh = parseInt(hStr);
  if(isNaN(gw)||isNaN(gh)||gw<=0||gh<=0){
    alert("输入数字无效");
    return;
  }
  const img = new Image();
  img.onload = ()=>{
    //把图片采样到方格
    const tempC = document.createElement("canvas");
    tempC.width = gw;
    tempC.height = gh;
    const tctx = tempC.getContext("2d");
    tctx.drawImage(img,0,0,gw,gh);
    const imgData = tctx.getImageData(0,0,gw,gh);
    for(let y=0;y<gh;y++){
      for(let x=0;x<gw;x++){
        const idx = (y*gw + x)*4;
        const r=imgData.data[idx];
        const g=imgData.data[idx+1];
        const b=imgData.data[idx+2];
        const a=imgData.data[idx+3];
        if(a>128){
          setCell(x,y,rgbToHex(r,g,b));
        }else{
          setCell(x,y,null);
        }
      }
    }
    saveHistory();
    renderGridCells();
  }
  img.src = URL.createObjectURL(file);
}

//面板开关
const panelToggle = document.getElementById("panelToggle");
const panel = document.getElementById("panel");
panelToggle.onclick = ()=>{
  panel.classList.toggle("open");
  panelToggle.textContent = panel.classList.contains("open") ? "收起操作台":"展开操作台";
}

updateToolButtonsHighlight();
buildColorGrid();
</script>
