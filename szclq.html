<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>多功能数字工具站</title>
    <style>
        * {box-sizing: border-box;font-family:system-ui}
        body{max-width:900px;margin:2rem auto;padding:0 1rem;background:#f4f7ff;}
        .box{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 10px #00000015}
        h2{margin-top:0;color:#223}
        input,select,button{padding:8px 10px;margin:4px;border:1px solid #aaa;border-radius:6px;font-size:16px}
        button{cursor:pointer;background:#3b74e8;color:white;border:none}
        button:hover{background:#285fc9}
        .word-item{display:flex;gap:6px;align-items:center;margin:6px 0}
        .del-btn{background:#e24444}
        #result{margin-top:10px;padding:10px;background:#f0f6ff;border-radius:8px;min-height:40px;font-weight:bold;font-size:17px}
        .tab{display:flex;gap:8px;margin-bottom:15px}
        .tab button{background:#ddd;color:#222}
        .tab button.active{background:#3b74e8;color:white}
    </style>
</head>
<body>
    <h1>数字检测 & 密码设计</h1>
    <div class="tab">
        <button class="active" onclick="switchTab('prime')">质数检测</button>
        <button onclick="switchTab('password')">密码生成器</button>
        <button onclick="switchTab('math')">数学工具</button>
    </div>
    <!-- 质数检测 -->
    <div id="tab-prime" class="box">
        <h2>质数检测器</h2>
        <input type="number" id="numPrime" placeholder="输入正整数">
        <button onclick="checkPrime()">检测是否为质数</button>
        <div id="resPrime"></div>
    </div>
    <!-- 密码生成器【核心重写JS】 -->
    <div id="tab-password" class="box" style="display:none">
        <h2>个性化账号密码设计</h2>
        <p>填写英文单词（你喜欢的昵称/动植物/食物/地区/名人，最多9条）</p>
        <div id="wordList">
            <!-- 动态输入框容器 -->
        </div>
        <button onclick="addWordInput()">+ 添加单词输入框</button>
        <hr>
        <p>选择喜欢的颜色：
            <input type="color" id="colorPicker">
            <span id="colorCode">#000000</span>
            <button onclick="getColor()">确认选取颜色</button>
        </p>
        <p>生日：
            <select id="monthSel">
                <option value="">选择月份</option>
            </select>
            <select id="daySel">
                <option value="">选择日期</option>
            </select>
        </p>
        <p style="font-size:14px;color:#555;">注：时段、年份自动读取本机系统时间，无需手动输入</p>
        <button onclick="generatePassword()">生成密码</button>
        <button onclick="copyPassword()">复制密码</button>
        <div id="result"></div>
        <div style="margin-top:8px;font-size:13px;color:#666">示例：阿尔卑斯山(Alps)、林肯(Lincoln)、马(Horse)｜白色#FFFFFF｜生日9‑9｜下午｜2026 → <b>Alh#FFF9916</b></div>
    </div>

    <!-- 数学工具 -->
    <div id="tab-math" class="box" style="display:none">
        <h2>数学小工具</h2>
        <div>
            <input type="number" id="numMath" placeholder="输入数字">
            <button onclick="calcMath()">完全数 / 水仙花数 / 阶乘</button>
            <div style="font-size:13px;color:#777;">阶乘最大支持70，大于70仅检测完全数、水仙花数</div>
        </div>
        <div style="margin-top:8px">
            <input type="number" id="g1" placeholder="数字A">
            <input type="number" id="g2" placeholder="数字B">
            <button onclick="gcdlcm()">GCD最大公约数 & LCM最小公倍数</button>
        </div>
        <div id="resMath"></div>
    </div>
<script>
// ========= 标签切换 =========
function switchTab(name){
    document.querySelectorAll('.box').forEach(el=>{
        if(el.id.startsWith("tab-")) el.style.display="none";
    })
    document.getElementById('tab-'+name).style.display="block";
    document.querySelectorAll('.tab button').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
}
// ========= 质数检测 =========
function checkPrime(){
    const n = Number(document.getElementById('numPrime').value);
    const div = document.getElementById('resPrime');
    if(!Number.isInteger(n) || n<=0){
        div.innerText = "请输入正整数！";
        return;
    }
    if(n===1){
        div.innerText = "1 不是质数";return;
    }
    let isP = true;
    for(let i=2;i*i<=n;i++){
        if(n%i===0){isP=false;break;}
    }
    div.innerText = isP ? `${n} 是质数` : `${n} 不是质数`;
}
// ========= 密码生成器 变量初始化 =========
let wordCount = 0;
const wordWrap = document.getElementById('wordList');
// 初始化1个输入框
addWordInput();
// 初始化月下拉
const monthSel = document.getElementById('monthSel');
const daySel = document.getElementById('daySel');
for(let m=1;m<=12;m++) monthSel.innerHTML += `<option value="${m}">${m}月</option>`;
for(let d=1;d<=31;d++) daySel.innerHTML += `<option value="${d}">${d}日</option>`;
// 颜色拾取器实时更新预览
document.getElementById('colorPicker').oninput = function(){
    document.getElementById('colorCode').innerText = this.value;
}
let colorSlice = "";
function getColor(){
    const c = document.getElementById('colorPicker').value;
    colorSlice = c.substring(1,4); // #后截取前3位
    alert(`已选取，截取字符：${colorSlice}`);
}
// 添加单词输入框 最多9个
function addWordInput(){
    if(wordCount >=9) return alert("最多只能添加9个单词！");
    wordCount++;
    const div = document.createElement('div');
    div.className="word-item";
    div.innerHTML = `<input type="text" class="word-input" placeholder="输入英文单词${wordCount}">
    <button class="del-btn" onclick="removeWord(this)">删除</button>`;
    wordWrap.appendChild(div);
}
function removeWord(btn){
    btn.parentElement.remove();
    wordCount--;
}
// 核心：生成密码
let finalPwd = "";
function generatePassword(){
    if(!colorSlice){
        alert("请先选择颜色并点击【确认选取颜色】");
        return;
    }
    const inputs = document.querySelectorAll('.word-input');
    let headChars = "";
    // 遍历单词，提取首字母
    inputs.forEach(inp=>{
        const val = inp.value.trim();
        if(val.length>0){
            const first = val[0];
            if(headChars.length===0){
                headChars += first.toUpperCase(); //第一个大写
            }else{
                headChars += first.toLowerCase();
            }
        }
    })
    if(headChars.length===0){
        alert("至少填写一个英文单词！");
        return;
    }
    // 生日拼接
    const m = document.getElementById('monthSel').value;
    const d = document.getElementById('daySel').value;
    if(!m || !d) return alert("请选择生日月和日");
    let dateStr = m + d;

    // 自动读取本地时间：上午(<12)=0，下午(>=12)=1
    const now = new Date();
    const hour = now.getHours();
    const timeBit = hour >=12 ? "1":"0";

    // 获取当前年份最后一位，2026→"6"
    const yearLastDigit = String(now.getFullYear()).slice(-1);

    // 【拼接规则完全匹配你的示例】首字母 + # +颜色3位 +生日 +时段0/1 +年份末位
    finalPwd = headChars + "#" + colorSlice + dateStr + timeBit + yearLastDigit;

    document.getElementById("result").innerText = `生成密码：${finalPwd}`;
}
// 复制密码
function copyPassword(){
    if(!finalPwd) return alert("请先生成密码！");
    navigator.clipboard.writeText(finalPwd).then(()=>{
        alert("密码已复制到剪贴板");
    }).catch(e=>{
        alert("复制失败，请手动复制："+finalPwd);
    })
}
// ========= 数学工具 =========
function calcMath(){
    let n = Number(document.getElementById("numMath").value);
    if(!Number.isInteger(n)||n<=0){
        document.getElementById("resMath").innerText="请输入正整数";
        return;
    }
    let out = "";
    // 完全数
    function isPerfect(num){
        if(num<2) return false;
        let s=0;
        for(let i=1;i<num;i++) if(num%i===0)s+=i;
        return s===num;
    }
    //水仙花
    function isNarcissus(num){
        let s=0,tmp=num;
        const len = String(num).length;
        while(tmp>0){
            let d=tmp%10;s+=d**len;tmp=Math.floor(tmp/10);
        }
        return s===num;
    }

    out += `完全数：${isPerfect(n)?'是':'否'} | 水仙花数：${isNarcissus(n)?'是':'否'}`;

    //阶乘限制70，大于70给出提示，不计算阶乘
    if(n <=70){
        let fac=1n;
        for(let i=2n;i<=BigInt(n);i++)fac*=i;
        out += ` | 阶乘：${fac.toString()}`;
    }else{
        out += ` | 阶乘：⚠数字太大了，输入小于等于70的数试试`;
    }

    document.getElementById("resMath").innerText=out;
}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a;}
function gcdlcm(){
    let a=Number(document.getElementById("g1").value);
    let b=Number(document.getElementById("g2").value);
    if(a<=0||b<=0||!Number.isInteger(a)||!Number.isInteger(b)){
        document.getElementById("resMath").innerText="请输入两个正整数";
        return;
    }
    const g = gcd(a,b);
    const l = a*b/g;
    document.getElementById("resMath").innerText=`最大公约数GCD=${g}，最小公倍数LCM=${l}`;
}
</script>
</body>
</html>
